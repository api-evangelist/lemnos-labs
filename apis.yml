aid: lemnos-labs
name: Lemnos Labs
description: >-
  Lemnos Labs, Inc. is an early-stage deeptech venture capital firm that invests at
  the earliest phases of hardware company formation, helping founders better
  understand their customer, anticipate problems, and leverage their assets. Lemnos
  contributes engineering, manufacturing, marketing, and financial capital alongside
  the check, and deliberately keeps a minimal public presence — its site is a single
  page that lists only the active portfolio. That portfolio spans robotics and
  autonomy (Built Robotics, Fort Robotics, Path Robotics, Scythe Robotics, Simbe
  Robotics, Petra), agricultural technology (FarmWise, Ceres Imaging), autonomous
  cargo aviation (Elroy Air), space data and precise positioning (Spire, Swift
  Navigation), simulation (Duality), video analytics (Lumeo), and physical security
  (Rhombus). Lemnos itself publishes no API, developer portal, SDK, or
  machine-readable specification; it is catalogued in the API Evangelist network as a
  venture-capital entity whose value to the network is its portfolio graph — several
  of its companies are meaningful API providers in their own right.
